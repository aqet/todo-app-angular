<div class="containt">
    <nav>
        <h1><a href="/home">Tasks<span>Flow</span></a></h1>
        <div class="navigation">
            <a  *ngFor="let nav of navigation" (click)="undeline(nav)">{{nav}}</a>
        </div>
        <div class="theme">
            <div class="mode" (click)="themeService.toggleTheme()">
                <img src="/mode.png" alt="">
                <p>{{ (themeService.darkMode$ | async) ? 'Clair' : 'Sombre' }}</p>
            </div>
            <a href="/profil" class="account" style="cursor: pointer;">
                <img src="/person.png" alt="">
                <p>{{name}}</p>
            </a>
            <div class="type">
                <img src="/logout.png" alt="">
                <p (click)="logout()" >Se deconnecter</p>
            </div>
        </div>
    </nav>
</div>
